name: Security Audit

on:
  push:
    branches: [ main ]
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm_audit
        continue-on-error: true
        run: npm audit --json --audit-level=critical > npm-audit-report.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: web/npm-audit-report.json
          retention-days: 30

      - name: Check npm audit severity
        env:
          AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
          REPORT_PATH: npm-audit-report.json
          SUMMARY_PATH: ${{ runner.temp }}/npm-audit-summary.md
        run: |
          node ../scripts/check-audit-report.mjs \
            --tool npm \
            --report "$REPORT_PATH" \
            --audit-outcome "$AUDIT_OUTCOME" \
            --summary-path "$SUMMARY_PATH"
          cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"

  cargo-audit:
    name: Cargo dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: cargo_audit
        continue-on-error: true
        run: cargo audit --file contracts/predinex/Cargo.lock --json > contracts/predinex/cargo-audit-report.json

      - name: Upload cargo audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: contracts/predinex/cargo-audit-report.json
          retention-days: 30

      - name: Check cargo audit severity
        env:
          AUDIT_OUTCOME: ${{ steps.cargo_audit.outcome }}
          REPORT_PATH: contracts/predinex/cargo-audit-report.json
          SUMMARY_PATH: ${{ runner.temp }}/cargo-audit-summary.md
        run: |
          node scripts/check-audit-report.mjs \
            --tool cargo \
            --report "$REPORT_PATH" \
            --audit-outcome "$AUDIT_OUTCOME" \
            --summary-path "$SUMMARY_PATH"
          cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"
